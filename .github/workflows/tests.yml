name: Pruebas de cálculo

# Corre node --test sobre docs/calculators/*/logic.js (ver tests/). La app en
# sí no tiene build — esto solo valida que las fórmulas no se rompan.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
