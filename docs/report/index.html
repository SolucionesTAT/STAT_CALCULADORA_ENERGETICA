<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Reporte de medición · STAT Calculadora Energética</title>
<meta name="theme-color" content="#0F1413">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../assets/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<style>
  @media print{
    .subheader, .keypad-dock, .bottom-nav{ display: none !important; }
    body{ background: #FFFFFF; }
    .report-sheet{ box-shadow: none; margin: 0; }
  }
</style>
<script>
  try{
    var s = JSON.parse(localStorage.getItem('stat-calc:settings') || '{}');
    if(s.theme && s.theme !== 'auto') document.documentElement.setAttribute('data-theme', s.theme);
  }catch(e){}
</script>
</head>
<body data-base="..">
<div class="app no-bottom-nav with-action-bar">
  <div class="subheader">
    <button type="button" class="back-btn" id="close-btn" aria-label="Cerrar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="title">Reporte de medición</div>
    <div class="meta">A4</div>
  </div>

  <div id="report-slot"></div>
</div>

<div class="keypad-dock" style="padding-top:14px">
  <div class="btn-row">
    <button type="button" class="btn btn-primary" id="print-btn">Guardar / imprimir PDF</button>
    <button type="button" class="btn-icon" id="share-btn" aria-label="Compartir">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7"/><path d="M16 6l-4-4-4 4M12 2v14"/></svg>
    </button>
  </div>
</div>

<script type="module" src="view-report.js"></script>
</body>
</html>
