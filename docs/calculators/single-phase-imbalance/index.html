<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Desbalance Monofásico · STAT Calculadora Energética</title>
<meta name="theme-color" content="#0F1413">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../assets/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<script>
  try{
    var s = JSON.parse(localStorage.getItem('stat-calc:settings') || '{}');
    if(s.theme && s.theme !== 'auto') document.documentElement.setAttribute('data-theme', s.theme);
  }catch(e){}
</script>
</head>
<body data-base="../..">
<div class="app no-bottom-nav with-keypad">
  <div class="subheader">
    <a class="back-btn" href="../../index.html" aria-label="Volver">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="title">Desbalance Monofásico</div>
  </div>

  <div class="screen" style="padding-top:6px">
    <div class="segctl" id="mode-switch" style="margin-bottom:18px">
      <button type="button" class="active" data-mode="voltage">⚡ Tensión (V)</button>
      <button type="button" data-mode="current">🔌 Corriente (A)</button>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px">
      <div class="label" id="field-title">Tensión línea a neutro</div>
      <div style="font:500 10.5px var(--font-mono); color:var(--text-tertiary)"><span id="filled-count">0</span> DE <span id="required-count">2</span></div>
    </div>

    <div id="fields" style="display:flex; flex-direction:column; gap:10px"></div>

    <div style="display:flex; align-items:center; gap:8px; margin-top:12px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      <span id="hint-text" style="font:400 11.5px var(--font-sans); color:var(--text-secondary)">Toca un campo y usa el teclado inferior.</span>
    </div>
  </div>
</div>

<div class="keypad-dock">
  <div class="keypad" id="keypad">
    <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
    <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
    <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
    <button type="button" data-key=".">.</button><button type="button" data-key="0">0</button>
    <button type="button" class="del-key" data-key="del" aria-label="Borrar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5h11v14H9L3 12z"/><path d="M13 9.5l4 5M17 9.5l-4 5"/></svg>
    </button>
  </div>
  <button type="button" class="btn btn-primary" id="calc-btn" disabled>Calcular desbalance</button>
</div>

<script type="module" src="view-capture.js"></script>
</body>
</html>
