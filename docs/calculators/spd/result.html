<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Resultado · STAT Calculadora Energética</title>
<meta name="theme-color" content="#0F1413">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../assets/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<script>
  try{
    var s = JSON.parse(localStorage.getItem('stat-calc:settings') || '{}');
    if(s.theme && s.theme !== 'auto') document.documentElement.setAttribute('data-theme', s.theme);
  }catch(e){}
</script>
</head>
<body data-base="../..">
<div class="app no-bottom-nav with-action-bar">
  <div class="subheader">
    <a class="back-btn" href="index.html" aria-label="Volver">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="title">Supresores de Transitorios</div>
    <div class="meta" id="page-meta">—</div>
  </div>

  <div class="screen" style="padding-top:6px">
    <div class="card" style="text-align:center; padding:24px 20px">
      <div class="label">SPD recomendado</div>
      <div class="tabular" id="type-readout" style="font:600 32px/1.25 var(--font-mono); color:var(--accent); margin-top:10px">—</div>
      <div id="type-note" style="font:500 11.5px var(--font-sans); color:var(--text-tertiary); margin-top:2px"></div>
      <div id="location-text" style="font:500 11.5px var(--font-sans); color:var(--text-secondary); margin-top:8px"></div>
    </div>

    <div class="label" style="margin:16px 0 10px">Especificaciones mínimas sugeridas</div>
    <div class="card">
      <div class="report-grid" id="specs-grid"></div>
    </div>

    <div class="label" style="margin:16px 0 10px">Verificación al instalar</div>
    <div class="card" id="checklist"></div>

    <div class="card" style="margin-top:12px; padding:11px 13px">
      <div style="font:400 11px/1.5 var(--font-sans); color:var(--text-tertiary)">Nota: equipos importados suelen etiquetarse también bajo UL 1449 / NEC Artículo 285, con una nomenclatura de Tipo similar.</div>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; margin:16px 0 10px">
      <div class="label">Datos usados</div>
      <a href="index.html?edit=1" class="edit-link" aria-label="Editar valores">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l5 5-9 9H6v-5z"/></svg>
        <span>Editar</span>
      </a>
    </div>
    <div class="card">
      <div class="report-grid" id="inputs-grid"></div>
    </div>

    <div class="card" style="margin-top:16px; display:flex; flex-direction:column; gap:10px">
      <div class="label">Datos de la medición (opcional)</div>
      <input id="board-input" type="text" placeholder="Tablero / equipo, ej. TD-3 · SPD principal"
        style="height:44px; background:var(--surface-sunken); border:1px solid var(--border); border-radius:var(--r-field); padding:0 var(--sp-3); color:var(--text); font:400 13.5px var(--font-sans);">
      <textarea id="notes-input" rows="2" placeholder="Observaciones"
        style="background:var(--surface-sunken); border:1px solid var(--border); border-radius:var(--r-field); padding:var(--sp-3); color:var(--text); font:400 13.5px var(--font-sans); resize:vertical;"></textarea>
    </div>

    <button type="button" class="btn btn-secondary" id="save-btn" style="margin-top:14px; gap:8px">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
      Guardar en historial
    </button>
  </div>
</div>

<div class="keypad-dock" style="padding-top:14px">
  <div class="btn-row">
    <button type="button" class="btn btn-primary" id="report-btn">Generar reporte</button>
    <button type="button" class="btn-icon" id="copy-btn" aria-label="Copiar resultado">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>
    </button>
  </div>
</div>

<script type="module" src="view-result.js"></script>
</body>
</html>
