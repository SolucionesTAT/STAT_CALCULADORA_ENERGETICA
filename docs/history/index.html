<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Historial · STAT Calculadora Energética</title>
<meta name="theme-color" content="#0F1413">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../assets/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<script>
  try{
    var s = JSON.parse(localStorage.getItem('stat-calc:settings') || '{}');
    if(s.theme && s.theme !== 'auto') document.documentElement.setAttribute('data-theme', s.theme);
  }catch(e){}
</script>
</head>
<body data-base="..">
<div class="app">
  <div class="screen" style="padding-top:var(--sp-4)">
    <div style="display:flex; align-items:baseline; justify-content:space-between">
      <h1 style="font:600 24px var(--font-sans); color:var(--text)">Historial</h1>
      <div style="font:500 11px var(--font-mono); color:var(--text-tertiary)"><span id="count">0</span> REGISTROS</div>
    </div>

    <div class="search-bar">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
      <input id="search-input" type="text" placeholder="Buscar por tablero o nota">
    </div>

    <div class="filter-row" id="filter-row">
      <button type="button" class="filter-chip active" data-filter="all">Todos</button>
      <button type="button" class="filter-chip" data-filter="good">Bueno</button>
      <button type="button" class="filter-chip" data-filter="warn">Precaución</button>
      <button type="button" class="filter-chip" data-filter="crit">Crítico</button>
    </div>

    <div id="list"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="../index.html">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20H4z"/></svg>
    <span>Inicio</span>
  </a>
  <a class="active" href="index.html">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    <span>Historial</span>
  </a>
  <a href="../about/index.html">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
    <span>Acerca de</span>
  </a>
</nav>

<script type="module" src="view-history.js"></script>
</body>
</html>
